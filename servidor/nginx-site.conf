# Nginx – site institucional Peruzzo & Schardosin (servidor Oracle)
# Copie para /etc/nginx/sites-available/peruzzo-site e ative com:
#   sudo ln -s /etc/nginx/sites-available/peruzzo-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d peruzzoschardosin.adv.br -d www.peruzzoschardosin.adv.br
server {
    listen 80;
    server_name peruzzoschardosin.adv.br www.peruzzoschardosin.adv.br;
    root /var/www/peruzzo-site;
    index index.html;
    charset utf-8;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Ative depois de confirmar o HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # artigos do blog: sempre a versão mais nova
    location = /blog/artigos.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Sistema (admin / Área do Cliente) – ajuste a porta do container do sistema
    # location /sistema/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
